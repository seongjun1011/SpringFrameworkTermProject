<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - 학생정보시스템</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="login-wrap">
    <div class="login-box">
        <h1>회원가입</h1>
        <p class="sub">학생정보시스템 계정 만들기</p>

        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/signup}" method="post">
            <div class="form-row">
                <label for="loginId">학번 / 아이디</label>
                <input type="text" id="loginId" name="loginId" th:value="${loginId}" placeholder="4~20자" required>
            </div>
            <div class="form-row">
                <label for="name">이름</label>
                <input type="text" id="name" name="name" th:value="${name}" required>
            </div>
            <div class="form-row">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="4자 이상" required>
            </div>
            <div class="form-row">
                <label for="passwordConfirm">비밀번호 확인</label>
                <input type="password" id="passwordConfirm" name="passwordConfirm" required>
            </div>
            <div class="form-row">
                <label for="department">학과</label>
                <input type="text" id="department" name="department" value="인공지능소프트웨어과">
            </div>
            <div class="form-row">
                <label for="campus">캠퍼스</label>
                <input type="text" id="campus" name="campus" value="서울정수캠퍼스">
            </div>
            <div class="form-row">
                <label for="grade">학년</label>
                <select id="grade" name="grade">
                    <option>1학년</option>
                    <option selected>2학년</option>
                </select>
            </div>
            <button type="submit" class="btn">가입하기</button>
        </form>
        <p style="text-align:center;margin-top:14px;font-size:13px;">
            이미 계정이 있나요? <a th:href="@{/login}">로그인</a>
        </p>
    </div>
</div>

</body>
</html>
