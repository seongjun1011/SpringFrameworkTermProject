<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공지사항 관리 - 학사관리시스템</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments/admin :: header}"></header>

<div class="app-body">
    <aside th:replace="~{fragments/admin :: sidebar('notices')}"></aside>

    <div class="app-content">
        <div class="breadcrumb">게시판 관리 &gt; 공지사항 작성</div>
        <h2 class="page-title">공지사항 작성</h2>
        <p class="page-desc">작성한 공지는 학생 화면의 공지사항과 통합포털 대시보드에 바로 표시됩니다.</p>

        <div class="alert success" th:if="${success}" th:text="${success}"></div>
        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <div class="card" style="max-width: 760px;">
            <form th:action="@{/admin/notices/new}" method="post">
                <div class="form-row">
                    <label for="title">제목</label>
                    <input type="text" id="title" name="title" th:value="${title}" maxlength="100" required>
                </div>
                <div class="form-row">
                    <label for="content">내용</label>
                    <textarea id="content" name="content" rows="7" maxlength="2000" required th:text="${content}"></textarea>
                </div>
                <p class="form-note" th:text="${'작성자: ' + session.loginStaff.department + ' (' + session.loginStaff.name + ')'}">작성자</p>
                <button type="submit" class="btn">등록</button>
            </form>
        </div>

        <div class="card" style="margin-top: 16px;">
            <div class="card-title">등록된 공지사항</div>
            <table class="data-table">
                <thead>
                <tr><th>제목</th><th>작성 부서</th><th>작성일</th></tr>
                </thead>
                <tbody>
                <tr th:each="n : ${notices}">
                    <td th:text="${n.title}">제목</td>
                    <td th:text="${n.writer}">부서</td>
                    <td th:text="${#temporals.format(n.createdAt, 'yyyy-MM-dd HH:mm')}">일시</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
