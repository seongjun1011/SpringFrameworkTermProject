<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 - 학생정보시스템</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="login-wrap">
    <div class="login-box">
        <h1>학생정보시스템</h1>
        <p class="sub">성준대학교 통합 학생정보시스템</p>

        <div class="alert error" th:if="${error}" th:text="${error}"></div>
        <div class="alert success" th:if="${success}" th:text="${success}"></div>

        <form th:action="@{/login}" method="post">
            <div class="form-row">
                <label for="loginId">학번 / 아이디</label>
                <input type="text" id="loginId" name="loginId" th:value="${loginId}" placeholder="학번을 입력하세요" required>
            </div>
            <div class="form-row">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
            </div>
            <button type="submit" class="btn">로그인</button>
        </form>
        <p style="text-align:center;margin-top:14px;font-size:13px;">
            <a th:href="@{/password/reset}">비밀번호 초기화</a>
        </p>
        <div class="hint">
            • 신입생·편입생의 초기 비밀번호는 <b>생년월일 6자리</b>(예: 030101)입니다.<br>
            • 최초 로그인 시 비밀번호를 반드시 변경해야 합니다.<br>
            • 비밀번호를 5회 잘못 입력하면 계정이 잠깁니다.<br>
            • 학적 정보 오류는 학사지원팀에 문의하세요.
        </div>
    </div>
</div>

</body>
</html>
