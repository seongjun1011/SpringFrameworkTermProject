server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
upload.dir.leave=uploads/leave
upload.dir.scholarship=uploads/scholarship
spring.application.name=student-portal

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# 날씨 외부 API (OpenWeatherMap) - 발급받은 키를 넣으면 실시간 날씨가 표시됩니다.
# https://openweathermap.org/api 에서 무료 키 발급 가능
# 키가 비어있으면 더미 날씨 데이터가 표시됩니다.
weather.api.key=
weather.api.city=Seoul

# ===== DB / JPA =====
# H2 파일 DB: 서버를 재시작해도 데이터가 유지됨 (./data/portaldb.mv.db)
spring.datasource.url=jdbc:h2:file:./data/portaldb;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# H2 콘솔: http://localhost:8080/h2-console
#
# [IntelliJ Database 창에서 연결하기]
#  Database 탭 > + > Data Source > H2
#  Connection type: URL only
#  URL : jdbc:h2:file:<프로젝트 경로>/data/portaldb;MODE=MySQL;AUTO_SERVER=TRUE
#  User: sa / Password: (비움)
#  AUTO_SERVER=TRUE 덕분에 서버 실행 중에도 IntelliJ에서 동시에 접속할 수 있다.
spring.h2.console.enabled=true
