<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 초기화 - 학생정보시스템</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="login-wrap">
    <div class="login-box">
        <h1>비밀번호 초기화</h1>
        <p class="sub">학적 정보로 본인 확인 후 비밀번호를 생년월일 6자리로 초기화합니다.</p>

        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/password/reset}" method="post">
            <div class="form-row">
                <label for="loginId">학번</label>
                <input type="text" id="loginId" name="loginId" th:value="${loginId}" required>
            </div>
            <div class="form-row">
                <label for="name">이름</label>
                <input type="text" id="name" name="name" th:value="${name}" required>
            </div>
            <div class="form-row">
                <label for="birthCode">생년월일 (6자리)</label>
                <input type="text" id="birthCode" name="birthCode" inputmode="numeric"
                       pattern="[0-9]{6}" maxlength="6" placeholder="예) 030101" required>
            </div>
            <button type="submit" class="btn">비밀번호 초기화</button>
        </form>
        <p style="text-align:center;margin-top:14px;font-size:13px;">
            <a th:href="@{/login}">로그인 화면으로</a>
        </p>
        <div class="hint">
            초기화하면 계정 잠금도 함께 해제되며, 다음 로그인 시 새 비밀번호로 변경해야 합니다.
        </div>
    </div>
</div>

</body>
</html>
