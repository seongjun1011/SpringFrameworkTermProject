server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
upload.dir.leave=uploads/leave
upload.dir.scholarship=uploads/scholarship
spring.application.name=SpringFrameworkTermProject

# 세션 ID는 쿠키로만 전달 (처음 접속한 브라우저에서 로그인 후 주소에 ;jsessionid가 붙어 404가 나는 문제 방지)
server.servlet.session.tracking-modes=cookie

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# 날씨 외부 API (OpenWeatherMap) - 보안상 API 키는 저장소에 포함하지 않습니다.
# 환경변수 WEATHER_API_KEY 에 발급받은 키를 설정하면 실시간 날씨가 표시됩니다.
# (https://openweathermap.org/api 에서 무료 키 발급 가능)
# 키가 없거나 API 호출에 실패하면 더미 날씨 데이터가 표시됩니다.
weather.api.key=${WEATHER_API_KEY:}
weather.api.city=Seoul

# ===== DB / JPA (MySQL) =====
# MySQL 8 · 데이터베이스 student-portal (utf8mb4)
# 테이블은 엔티티 클래스를 기준으로 서버 시작 시 자동 생성·갱신된다(ddl-auto=update).
# DB가 없으면 createDatabaseIfNotExist=true 옵션으로 자동 생성한다.
spring.datasource.url=jdbc:mysql://localhost:3306/student-portal?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=rootroot
spring.datasource.password=12341234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
#
# [IntelliJ Database 창에서 보기]
#  Database 탭 > + > Data Source > MySQL
#  Host: localhost / Port: 3306 / User: rootroot / Password: 12341234 / Database: student-portal
