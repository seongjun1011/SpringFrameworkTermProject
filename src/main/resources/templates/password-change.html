<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호변경 - 학생정보시스템</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- 비밀번호 변경 폼 (최초 로그인 화면과 일반 메뉴 화면에서 함께 사용).
     바깥 th:if="false"는 정의 위치에서는 그리지 않기 위한 것이고, 아래 th:replace로 삽입될 때만 보인다. -->
<th:block th:if="${false}"><th:block th:fragment="form">
    <div class="alert error" th:if="${error}" th:text="${error}"></div>
    <div class="alert success" th:if="${success}" th:text="${success}"></div>
    <form th:action="@{/password/change}" method="post">
        <div class="form-row">
            <label for="currentPassword">현재 비밀번호</label>
            <input type="password" id="currentPassword" name="currentPassword" required
                   th:placeholder="${student.passwordChangeRequired} ? '초기 비밀번호 (생년월일 6자리)' : ''">
        </div>
        <div class="form-row">
            <label for="newPassword">새 비밀번호</label>
            <input type="password" id="newPassword" name="newPassword" required
                   minlength="8" maxlength="20" placeholder="영문+숫자 8~20자">
        </div>
        <div class="form-row">
            <label for="newPasswordConfirm">새 비밀번호 확인</label>
            <input type="password" id="newPasswordConfirm" name="newPasswordConfirm" required
                   minlength="8" maxlength="20">
        </div>
        <button type="submit" class="btn">비밀번호 변경</button>
    </form>
</th:block></th:block>

<!-- 최초 로그인(초기 비밀번호 사용 중): 다른 메뉴 없이 변경 화면만 보여준다 -->
<div class="login-wrap" th:if="${student.passwordChangeRequired}">
    <div class="login-box">
        <h1>비밀번호 변경</h1>
        <p class="sub" th:text="${student.name + '님, 초기 비밀번호를 사용 중입니다. 새 비밀번호로 변경해야 서비스를 이용할 수 있습니다.'}"></p>
        <th:block th:replace="~{::form}"></th:block>
        <p style="text-align:center;margin-top:14px;font-size:13px;">
            <a th:href="@{/logout}">로그아웃</a>
        </p>
    </div>
</div>

<th:block th:unless="${student.passwordChangeRequired}">
    <header th:replace="~{fragments/header :: header('system')}"></header>
    <div class="app-body">
        <aside th:replace="~{fragments/sidebar :: sidebar('password')}"></aside>
        <div class="app-content">
            <div class="breadcrumb">학적/학생 &gt; 비밀번호변경</div>
            <h2 class="page-title">비밀번호변경</h2>
            <p class="page-desc">영문과 숫자를 포함해 8~20자로 입력하세요. 학번이나 생년월일이 들어간 비밀번호는 사용할 수 없습니다.</p>
            <div class="card" style="max-width: 560px;">
                <th:block th:replace="~{::form}"></th:block>
            </div>
        </div>
    </div>
</th:block>

</body>
</html>
