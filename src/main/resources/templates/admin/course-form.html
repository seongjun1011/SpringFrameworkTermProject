<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>강좌 개설 · 수정 - 학사관리시스템</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments/admin :: header}"></header>

<div class="app-body">
    <aside th:replace="~{fragments/admin :: sidebar('courses')}"></aside>

    <div class="app-content">
        <div class="breadcrumb">수업 관리 &gt; 강좌 개설 · 수정</div>
        <h2 class="page-title" th:text="${course == null ? '강좌 개설' : '강좌 수정'}">강좌 개설</h2>
        <p class="page-desc" th:if="${course == null}">시간표는 월~금, 1~6교시로 구성됩니다. 같은 강의실을 같은 시간에 쓰는 강좌는 개설할 수 없습니다.</p>
        <p class="page-desc" th:if="${course != null}"
           th:text="${'현재 신청 인원 ' + course.enrolledCount + '명. ' + (course.enrolledCount > 0 ? '신청한 학생이 있어 요일·교시는 바꿀 수 없고, 정원은 ' + course.enrolledCount + '명 이상이어야 합니다.' : '아직 신청한 학생이 없습니다.')}">안내</p>

        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <div class="card" style="max-width: 560px;">
            <form method="post"
                  th:action="${course == null} ? @{/admin/courses/new} : @{/admin/courses/{id}/edit(id=${course.id})}">
                <div class="form-row">
                    <label for="name">과목명</label>
                    <input type="text" id="name" name="name" th:value="${form.name}" maxlength="50" required>
                </div>
                <div class="form-row">
                    <label for="professor">담당교수</label>
                    <input type="text" id="professor" name="professor" th:value="${form.professor}" maxlength="30" required>
                </div>
                <div class="form-row">
                    <label for="dayOfWeek">요일</label>
                    <select id="dayOfWeek" name="dayOfWeek">
                        <option th:each="d : ${days}" th:value="${d}" th:text="${d + '요일'}"
                                th:selected="${d == form.dayOfWeek}">월요일</option>
                    </select>
                </div>
                <div class="form-row form-row-inline">
                    <div>
                        <label for="startPeriod">시작 교시</label>
                        <select id="startPeriod" name="startPeriod">
                            <option th:each="p : ${#numbers.sequence(1, maxPeriod)}" th:value="${p}" th:text="${p + '교시'}"
                                    th:selected="${p == form.startPeriod}">1교시</option>
                        </select>
                    </div>
                    <div>
                        <label for="endPeriod">종료 교시</label>
                        <select id="endPeriod" name="endPeriod">
                            <option th:each="p : ${#numbers.sequence(1, maxPeriod)}" th:value="${p}" th:text="${p + '교시'}"
                                    th:selected="${p == form.endPeriod}">2교시</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <label for="location">강의실</label>
                    <input type="text" id="location" name="location" th:value="${form.location}" maxlength="20"
                           placeholder="예) 201호" required>
                </div>
                <div class="form-row">
                    <label for="capacity">정원</label>
                    <input type="number" id="capacity" name="capacity" th:value="${form.capacity}" min="1" max="300" required>
                </div>
                <button type="submit" class="btn" th:text="${course == null ? '개설' : '저장'}">개설</button>
                <a class="btn btn-outline" th:href="@{/admin/courses}">목록으로</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
